<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recyc'Objet - Rechercher un objet</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="site-title">Recyc'Objet</h1>
    </div>
  </header>

  <main id="main-content" class="container">
    <section class="search-section" aria-labelledby="section-title">
      <h2 id="section-title">Que souhaitez-vous rechercher ?</h2>
      <p id="search-help" class="help-text">Vous pouvez rechercher un objet par son nom.</p>

      <form id="search-form" class="search-form" role="search" novalidate>
        <div class="form-group">
          <label for="search-input" class="form-label">Nom de l'objet</label>
          <input
            type="search"
            id="search-input"
            name="q"
            class="search-input"
            placeholder="Exemple : pile, téléphone..."
            autocomplete="off"
            aria-describedby="search-help"
            required
          >
        </div>
        <button type="submit" id="search-button" class="btn btn-primary">Rechercher</button>
      </form>
    </section>

    <section id="results-section" class="results-section" aria-live="polite" hidden>
      <!-- Zone d'affichage dynamique des résultats (E02 ou E03) -->
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
